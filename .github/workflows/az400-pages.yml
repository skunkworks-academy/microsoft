name: Deploy AZ-400 Site

on:
  push:
    branches: [main]
    paths:
      - "AZ-400/**"
      - ".github/workflows/az400-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: microsoft-pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_TARGET: gh-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: AZ-400/web/package-lock.json
      - name: Install
        run: npm ci
        working-directory: AZ-400/web
      - name: Build
        run: npm run build
        working-directory: AZ-400/web

      - name: Enforce canonical Academy v10 shell on every generated HTML page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('AZ-400/web/out')
          current = 'https://skunkworksacademy.com/assets/academy-navigation.js?v=2026.08.15.1'
          marker = 'data-skunkworks-global-nav="v10"'
          loader = f'<script defer src="{current}" {marker}></script>'
          old_tags = re.compile(r'<script\b[^>]*(?:academy-navigation(?:-loader)?\.js|data-skunkworks-global-nav|data-skunkworks-global-shell)[^>]*>\s*</script>', re.I | re.S)
          pages = sorted(root.rglob('*.html'))
          if not pages:
              raise SystemExit('Microsoft Pages build produced no HTML pages.')

          for path in pages:
              html = path.read_text(encoding='utf-8', errors='ignore')
              html = old_tags.sub('', html)
              if re.search(r'</head\s*>', html, re.I):
                  html = re.sub(r'</head\s*>', f'  {loader}\n</head>', html, count=1, flags=re.I)
              elif re.search(r'</body\s*>', html, re.I):
                  html = re.sub(r'</body\s*>', f'  {loader}\n</body>', html, count=1, flags=re.I)
              else:
                  raise SystemExit(f'Cannot inject Academy shell into {path}')
              path.write_text(html, encoding='utf-8')

          failed = []
          duplicate = []
          for path in pages:
              html = path.read_text(encoding='utf-8', errors='ignore')
              if current not in html or marker not in html:
                  failed.append(str(path))
              if html.count('academy-navigation.js') > 1:
                  duplicate.append(str(path))
          if failed:
              raise SystemExit('Canonical shell missing from: ' + ', '.join(failed))
          if duplicate:
              raise SystemExit('Duplicate shell loaders in: ' + ', '.join(duplicate))
          print(f'Verified Academy canonical v10 shell on {len(pages)} Microsoft page(s).')
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: AZ-400/web/out
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
